name: Security and deployment checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

# Least privilege: these jobs only read the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet, tests, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Fails when a dependency reachable from this code has a known vulnerability, except the IDs in
      # ACCEPTED. GO-2025-3553 (golang-jwt/jwt v3, no fix exists) is reached only through
      # go-pkgz/auth, which has no release on jwt v5. It is a memory-use issue on a crafted token
      # header, not an auth bypass. Remove it from ACCEPTED once go-pkgz/auth drops jwt v3.
      - name: govulncheck
        env:
          ACCEPTED: GO-2025-3553
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > govulncheck.json
          found=$(jq -r --arg accepted "$ACCEPTED" '
            select(.finding != null and .finding.trace[0].function != null)
            | .finding.osv
            | select(. as $id | ($accepted | split(",") | index($id)) | not)' govulncheck.json | sort -u)
          if [ -n "$found" ]; then
            echo "Reachable vulnerabilities:"; echo "$found"
            exit 1
          fi

  web:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --silent
      # Production dependencies only: dev tooling never ships in the image
      - run: npm audit --omit=dev --audit-level=high

  scripts:
    name: Shell script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/*.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh

  compose:
    name: Compose files render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Production file, and the optional socket-proxy overlay
        env:
          JWT_SECRET: ci
          GATEWAY_API_KEY: ci
          REGISTRATION_TOKEN: ci
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.socket-proxy.yml config -q

  smoke:
    name: Fresh install and restart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # Builds the images, bootstraps a throwaway install, asserts the security behaviour, restarts
      # the primary and asserts nothing was lost (see scripts/smoke-test.sh)
      - run: ./scripts/smoke-test.sh
