name: Release selfhostlyctl

# A normal push to main publishes the tool as the rolling "edge" release, so installing it never needs
# a version tag. A v* tag publishes a numbered release as well.
on:
  push:
    branches: [main]
    paths:
      - "cmd/selfhostlyctl/**"
      - "internal/ctl/**"
      - "go.mod"
      - "go.sum"
      - "scripts/install.sh"
      - ".github/workflows/release-cli.yml"
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the command line tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/ctl/...
      - name: Build for linux and macOS, amd64 and arm64
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME}"; else version="edge-${GITHUB_SHA::7}"; fi
          mkdir dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/selfhostly/internal/ctl.Version=${version}" \
                -o dist/selfhostlyctl_${os}_${arch} ./cmd/selfhostlyctl
            done
          done
          (cd dist && sha256sum selfhostlyctl_* > checksums.txt)
      - name: Publish a numbered release (tags)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Publish the rolling edge release (main)
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push -f origin edge
          gh release delete edge --yes || true
          gh release create edge dist/* --prerelease --title "edge (latest main)" \
            --notes "Built from ${GITHUB_SHA}. Rolling build of the latest main; use a numbered release for a fixed version."
